kind = "mobile"
previewPath = "/"
title = "Foodie Recipe App"
description = "A polished recipe discovery app with searchable food categories, favorites, recipe details, and personal recipe creation and editing."
version = "1.0.0"
id = "artifacts/foodie"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24336

[services.development]
run = "pnpm --filter @workspace/foodie run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/foodie", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/foodie", "run", "serve" ]

[services.env]
PORT = "24336"
BASE_PATH = "/"
